<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymTrAIner — Μετατροπή χαρακτήρα Mixamo</title>
<style>
  body{font:15px system-ui,sans-serif;margin:0;background:#f4f6fb;color:#0f172a}
  main{max-width:860px;margin:0 auto;padding:20px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px}
  input,select,button{font:inherit;padding:6px 10px} pre{white-space:pre-wrap;font-size:.85rem}
</style>
<script type="importmap">{ "imports": { "three": "../js/vendor/three.module.min.js" } }</script>
</head>
<body><main>
<h1>🧍 Μετατροπή χαρακτήρα Mixamo → coach</h1>
<div class="card">
  <p>Mixamo → Characters → Download: <b>FBX Binary, T-pose</b>. Εδώ γίνεται ελαφρύ <code>.glb</code> (υφές έως 1024px, JPEG) για το <code>assets/models/</code>.</p>
  <input type="file" id="file" accept=".fbx"> <select id="size"><option>1024</option><option>2048</option><option>512</option></select>
  <button id="go">Μετατροπή</button>
  <pre id="out"></pre>
</div>
</main>
<script type="module">
import * as THREE from '../js/vendor/three.module.min.js';
import { FBXLoader } from '../js/vendor/jsm/loaders/FBXLoader.js';
import { GLTFExporter } from '../js/vendor/jsm/exporters/GLTFExporter.js';
import { mergeVertices } from '../js/vendor/jsm/utils/BufferGeometryUtils.js';

const MAPS = ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap', 'alphaMap', 'specularMap', 'bumpMap'];

/** Σμίκρυνση υφής σε canvas (μέγιστη πλευρά = max). Διατηρεί διαφάνεια όπου υπάρχει. */
const _shrunk = new Map(), _mats = new Map();
function shrink(tex, max, hasAlpha) {
  const key = tex && tex.uuid + '|' + max + '|' + hasAlpha; if (key && _shrunk.has(key)) return _shrunk.get(key);
  const img = tex?.image; if (!img || !(img.naturalWidth || img.width)) return null;
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.max(4, Math.round(img.width * k)); c.height = Math.max(4, Math.round(img.height * k));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.flipY = tex.flipY; t.wrapS = tex.wrapS; t.wrapT = tex.wrapT; t.colorSpace = tex.colorSpace;
  t.userData.mimeType = hasAlpha ? 'image/png' : 'image/jpeg';
  _shrunk.set(key, t);
  return t;
}

/** FBX (ArrayBuffer) → GLB (ArrayBuffer) + αναφορά */
export async function convert(buf, max = 1024) {
  const obj = new FBXLoader().parse(buf, '');
  obj.animations = [];
  obj.updateMatrixWorld(true);
  // 1. Κανονικοποίηση ονομάτων οστών (mixamorig5:Hips → Hips)
  obj.traverse(o => { if (o.isBone) o.name = o.name.replace(/^mixamorig\d*[:_]?/i, ''); });
  // 2. Το FBXLoader δημιουργεί διπλότυπα οστά ανά κομμάτι (ρούχα) ως παιδιά με το ίδιο όνομα.
  //    Δένουμε κάθε σκελετό στο «αρχικό» οστό (αν συμπίπτουν στον χώρο) και σβήνουμε τα διπλότυπα.
  const canon = b => { let c = b; while (c.parent?.isBone && c.parent.name === b.name) c = c.parent; return c; };
  let merged = 0, mismatch = 0;
  obj.traverse(o => {
    if (!o.isSkinnedMesh) return;
    const sk = o.skeleton;
    sk.bones = sk.bones.map(b => { const c = canon(b); if (c === b) return b;
      const d = new THREE.Vector3().setFromMatrixPosition(b.matrixWorld).distanceTo(new THREE.Vector3().setFromMatrixPosition(c.matrixWorld));
      if (d > 1e-3) { mismatch++; return b; } merged++; return c; });
  });
  if (!mismatch) {
    const dups = []; obj.traverse(o => { if (o.isBone && canon(o) !== o) dups.push(o); });
    for (const d of dups) { [...d.children].forEach(ch => { if (!ch.isBone || ch.name !== d.name) canon(d).attach(ch); }); }
    for (const d of dups) d.removeFromParent();
  }
  // Οι ενσωματωμένες υφές φορτώνουν ασύγχρονα (blob URLs): περιμένουμε να έχουν διαστάσεις
  const texs = new Set();
  obj.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => MAPS.forEach(k => m[k] && texs.add(m[k]))); });
  const ready = t => t.image && (t.image.naturalWidth || t.image.width);
  for (let i = 0; i < 200 && [...texs].some(t => !ready(t)); i++) await new Promise(r => setTimeout(r, 50));
  for (const t of texs) if (!ready(t)) for (const o of [obj]) o.traverse(x => { if (x.isMesh) (Array.isArray(x.material) ? x.material : [x.material]).forEach(m => MAPS.forEach(k => { if (m[k] === t) m[k] = null; })); });
  const report = { meshes: 0, tris: 0, bones: 0, materials: [] };
  obj.traverse(o => {
    if (o.isBone) report.bones++;
    if (!o.isMesh) return;
    report.meshes++;
    // Το FBX δίνει «σκόρπιες» κορυφές (3 ανά τρίγωνο): ενώνουμε τις ίδιες → ~1/3 μέγεθος
    if (!o.geometry.index) { const g = mergeVertices(o.geometry, 1e-5); o.geometry.dispose(); o.geometry = g; }
    report.tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
    const conv = m => { if (_mats.has(m)) return _mats.get(m); const out = conv0(m); _mats.set(m, out); return out; };
    const conv0 = m => {
      // Phong/Lambert (nonPBR) → Standard (PBR) για σωστό φωτισμό στο three.js/glTF
      const transparent = !!(m.transparent || m.alphaMap || (m.opacity ?? 1) < 1 || /hair|lash|brow/i.test(m.name));
      const n = new THREE.MeshStandardMaterial({
        name: m.name, color: m.color?.clone() ?? new THREE.Color(1, 1, 1),
        map: shrink(m.map, max, transparent), normalMap: shrink(m.normalMap, max, false),
        alphaMap: shrink(m.alphaMap, max, true), emissiveMap: shrink(m.emissiveMap, max, false),
        emissive: m.emissive?.clone() ?? new THREE.Color(0, 0, 0),
        roughness: m.shininess != null ? Math.max(0.35, 1 - Math.min(m.shininess, 100) / 140) : 0.7, metalness: 0,
        transparent, alphaTest: transparent ? 0.4 : 0, side: transparent ? THREE.DoubleSide : THREE.FrontSide,
        opacity: m.opacity ?? 1,
      });
      if (n.map) n.map.colorSpace = THREE.SRGBColorSpace;
      report.materials.push(`${m.name} (${m.type}${m.map ? ', υφή ' + (m.map.image?.width || '?') + 'px' : ''})`);
      return n;
    };
    o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
  });
  const glb = await new GLTFExporter().parseAsync(obj, { binary: true, animations: [], maxTextureSize: max });
  report.tris = Math.round(report.tris); report.bytes = glb.byteLength; report.mergedBones = merged; report.boneMismatch = mismatch;
  return { glb, report };
}
window.convertUrl = async (url, max) => { const r = await convert(await (await fetch(url)).arrayBuffer(), max);
  const b = new Uint8Array(r.glb); let s = ''; for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode(...b.subarray(i, i + 8192));
  return { b64: btoa(s), report: r.report }; };
window.ready = true;

document.getElementById('go').onclick = async () => {
  const f = document.getElementById('file').files[0], out = document.getElementById('out'); if (!f) return;
  out.textContent = '⏳ Μετατροπή…';
  try {
    const { glb, report } = await convert(await f.arrayBuffer(), +document.getElementById('size').value);
    const name = f.name.replace(/\.fbx$/i, '').toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.glb';
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' })); a.download = name; a.textContent = '⬇ ' + name;
    out.textContent = JSON.stringify(report, null, 2); out.prepend(a, document.createElement('br'));
  } catch (e) { out.textContent = '❌ ' + e.message; }
};
</script>
</body></html>
